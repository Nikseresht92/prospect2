.notice{position:fixed;bottom:calc(var(--s-5) + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:var(--s-3) var(--s-4);border-radius:var(--r-sm);font-size:var(--text-sm);font-weight:var(--w-medium);box-shadow:var(--shadow-2);z-index:40;max-width:calc(100vw - var(--s-5)*2);pointer-events:none;text-align:center;transition:opacity .2s ease-out}
.notice[hidden]{display:none}
.stop-chip{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-4);background:var(--ink);color:#fff;border-radius:var(--r-pill);font-size:var(--text-sm);font-weight:var(--w-medium);box-shadow:var(--shadow-2);z-index:35;min-height:36px}
.stop-chip[hidden]{display:none}
.stop-chip-icon{display:grid;place-items:center;width:12px;height:12px;font-size:9px;line-height:1}
.noscript-banner{background:var(--amber-bg);color:var(--amber-dark);padding:var(--s-3) var(--s-5);text-align:center;font-size:var(--text-sm);font-weight:var(--w-medium)}
.confetti-canvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:100;display:none}
.achievement-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);display:flex;align-items:center;gap:12px;padding:12px 20px;background:linear-gradient(135deg,var(--ink),#292524);color:#fff;border-radius:var(--r-md);box-shadow:0 12px 32px rgba(0,0,0,.3);z-index:200;max-width:calc(100vw - 40px);transition:transform .4s var(--ease-out);border:1px solid #44403c}
.achievement-toast.show{transform:translateX(-50%) translateY(0)}

.mt-24{margin-top:var(--s-5)}
.mb-16{margin-bottom:var(--s-4)}
.row{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap}
.text-sm{font-size:var(--text-sm)}
.text-muted{color:var(--ink-2)}
.spelling-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:var(--primary-bg);color:var(--primary-dark);border-radius:var(--r-pill);font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;border:1px solid var(--primary-soft)}

/* ←←← FIX: crossword letters LTR, left-aligned ←←← */
.crossword-boxes{display:flex;gap:var(--s-1);align-items:center;flex-wrap:wrap;direction:ltr;justify-content:flex-start}
.cw-box{width:38px;height:42px;text-align:center;font-family:'Nunito',sans-serif;font-size:20px;font-weight:700;text-transform:uppercase;border:2px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);padding:0;direction:ltr}

<body>

<noscript><div class="noscript-banner">برای استفاده از این اپلیکیشن، جاوااسکریپت مرورگر خود را فعال کنید.</div></noscript>

      <button type="button" class="icon-btn" id="muteBtn" onclick="toggleMute()" aria-pressed="false" aria-label="قطع صدا" title="قطع/وصل صدا"><span id="muteIcon"></span></button>

<button type="button" class="stop-chip" id="stopChip" onclick="stopSpeech()" hidden><span class="stop-chip-icon">■</span><span>توقف تلفظ</span></button>

<div class="notice" id="notice" hidden role="status" aria-live="polite"></div>

<script>
/* ═══════════════════ ICONS + HELPERS ═══════════════════ */
const ICONS={
check:'<polyline points="20 6 9 17 4 12"/>',
lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',
volume:'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>',
volumeOff:'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>',
arrowRight:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
arrowLeft:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
refresh:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>',
x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
play:'<polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/>',
keyboard:'<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/>',
grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
book:'<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>',
mic:'<path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>',
clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
};
function icon(n,s=16){const d=ICONS[n]||'';return `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`}
function toFa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function shuffled(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function decorateA11y(){
  document.querySelectorAll('.speak-btn,.quiz-audio,.flashcard-audio,.word-audio').forEach(b=>{if(!b.getAttribute('aria-label')&&!b.textContent.trim())b.setAttribute('aria-label','پخش تلفظ')});
  document.querySelectorAll('.role-input').forEach(inp=>{
    if(inp.getAttribute('aria-label'))return;
    const row=inp.closest('.role-field');
    const ask=row&&row.querySelector('.role-ask')?row.querySelector('.role-ask').textContent.trim():'';
    inp.setAttribute('aria-label',ask||'پاسخ نقش‌آفرینی');
  });
  document.querySelectorAll('.crossword-item').forEach(item=>{
    const clue=item.querySelector('.crossword-clue')?item.querySelector('.crossword-clue').textContent.trim().slice(0,60):'';
    item.querySelectorAll('.cw-box').forEach((inp,i)=>{if(!inp.getAttribute('aria-label'))inp.setAttribute('aria-label',`حرف ${i+1}${clue?' — '+clue:''}`)});
  });
}

/* ═══════════════════ SOUND FX ═══════════════════ */
const SoundFX=(()=>{let ctx=null;function g(){if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==='suspended')ctx.resume().catch(()=>{});return ctx}
function t(f,d,ty,v,de,fe){const c=g();if(!c)return;const o=c.createOscillator(),gn=c.createGain();o.type=ty||'sine';o.frequency.value=f;if(fe)o.frequency.exponentialRampToValueAtTime(fe,c.currentTime+(de||0)+d);o.connect(gn);gn.connect(c.destination);const s=c.currentTime+(de||0);gn.gain.setValueAtTime(0,s);gn.gain.linearRampToValueAtTime(v,s+.01);gn.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d+.05)}
return{
correct(){if(isMuted)return;t(659.25,.12,'sine',.12);t(987.77,.22,'sine',.10,.1)},
wrong(){if(isMuted)return;t(196,.18,'sine',.12);t(146.83,.28,'sine',.10,.12)},
complete(){if(isMuted)return;[523.25,659.25,783.99,1046.5].forEach((f,i)=>t(f,.28,'sine',.11,i*.1))},
click(){if(isMuted)return;t(660,.05,'sine',.05)},
star(){if(isMuted)return;t(1318.5,.1,'sine',.07);t(1760,.15,'sine',.06,.06)}
}})();

/* ═══════════════════ CONFETTI ═══════════════════ */
function fireConfetti(){const c=document.getElementById('confettiCanvas');if(!c)return;c.width=innerWidth;c.height=innerHeight;c.style.display='block';const x=c.getContext('2d');const cols=['#2563eb','#fbbf24','#10b981','#ef4444','#8b5cf6','#ec4899','#f97316'];const ps=[];for(let i=0;i<140;i++)ps.push({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight/3,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,size:Math.random()*8+4,color:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.35,life:1,shape:Math.random()>.5?'rect':'circle'});let fr=0;function a(){x.clearRect(0,0,c.width,c.height);let al=false;ps.forEach(p=>{if(p.life<=0)return;al=true;p.x+=p.vx;p.y+=p.vy;p.vy+=.42;p.vx*=.99;p.rot+=p.vr;p.life-=.007;x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.color;if(p.shape==='circle'){x.beginPath();x.arc(0,0,p.size/2,0,Math.PI*2);x.fill()}else x.fillRect(-p.size/2,-p.size/2,p.size,p.size*.55);x.restore()});fr++;if(al&&fr<220)requestAnimationFrame(a);else c.style.display='none'}a()}

/* ═══════════════════ ACHIEVEMENTS ═══════════════════ */
const ACHIEVEMENTS={
  first_correct:{title:'قدم اول',desc:'اولین پاسخ صحیح',icon:'🎯'},
  combo_5:{title:'شعله‌ور',desc:'۵ پاسخ صحیح پشت سر هم',icon:'🔥'},
  combo_10:{title:'آتشین',desc:'۱۰ پاسخ صحیح پشت سر هم',icon:'⚡'},
  section_1_done_L1:{title:'شروع خوب (درس ۱)',desc:'بخش اول درس ۱ تکمیل شد',icon:'🏆'},
  section_1_done_L2:{title:'شروع خوب (درس ۲)',desc:'بخش اول درس ۲ تکمیل شد',icon:'🏆'},
  all_sections_done_L1:{title:'فاتح درس ۱',desc:'همه ۷ بخش درس ۱ تکمیل شد',icon:'👑'},
  all_sections_done_L2:{title:'فاتح درس ۲',desc:'همه ۷ بخش درس ۲ تکمیل شد',icon:'👑'},
  all_words_mastered_L1:{title:'استاد واژگان ۱',desc:'همه کلمات درس ۱ بلد شده',icon:'📚'},
  all_words_mastered_L2:{title:'استاد واژگان ۲',desc:'همه کلمات درس ۲ بلد شده',icon:'📚'},

function showAchievement(k){const a=ACHIEVEMENTS[k];if(!a)return;if(!appState.achievements)appState.achievements=[];if(appState.achievements.includes(k))return;appState.achievements.push(k);saveState();SoundFX.star();const el=document.createElement('div');el.className='achievement-toast';el.innerHTML=`<span class="achievement-toast-icon">${a.icon}</span><div class="achievement-toast-body"><span class="achievement-toast-title">${esc(a.title)}</span><span class="achievement-toast-desc">${esc(a.desc)}</span></div>`;document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),500)},3000)}

/* ═══════════════════ STREAK ═══════════════════ */
const STREAK_KEY='g8_streak_v1';
function getStreak(){try{const r=localStorage.getItem(STREAK_KEY);if(!r)return{days:0,lastDate:null};return JSON.parse(r)}catch(e){return{days:0,lastDate:null}}}
function localDateStr(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function updateStreak(){const today=localDateStr();const s=getStreak();if(s.lastDate===today){renderStreak(s.days);return s}const yd=new Date();yd.setDate(yd.getDate()-1);if(s.lastDate===localDateStr(yd))s.days+=1;else s.days=1;s.lastDate=today;try{localStorage.setItem(STREAK_KEY,JSON.stringify(s))}catch(e){}renderStreak(s.days);return s}
function renderStreak(d){const b=document.getElementById('streakBadge'),l=document.getElementById('streakDays');if(!b||!l)return;if(!d||d<1){b.hidden=true;return}b.hidden=false;l.textContent=toFa(d);b.title=`${toFa(d)} روز متوالی`}

/* ═══════════════════ COMBO ═══════════════════ */
let comboCount=0;
function getComboMultiplier(){if(comboCount>=10)return 3;if(comboCount>=5)return 2;return 1}
function updateComboUI(){const h=document.getElementById('comboHost');if(!h)return;if(comboCount<3){h.innerHTML='';return}const m=getComboMultiplier();const f=comboCount>=10?'🔥🔥🔥':comboCount>=5?'🔥🔥':'🔥';h.innerHTML=`<div class="combo-badge">${f} ×${toFa(comboCount)}${m>1?` · ${toFa(m)}× ⭐`:''}</div>`}
function resetCombo(){comboCount=0;updateComboUI()}

function isValidStrArr(v){return Array.isArray(v)&&v.every(x=>typeof x==='string')}
function sanitizeLessonState(raw){
  const s={completedSections:[],rewardedIds:[],rewardStars:{},answeredQuizIds:[],answeredQuizzes:{},retryQueues:{},lastSectionId:1,lastStep:1,completedWorkbook:[]};
  if(!raw||typeof raw!=='object')return s;
  s.completedSections=Array.isArray(raw.completedSections)?raw.completedSections.filter(n=>Number.isInteger(n)&&n>=1&&n<=TOTAL_SECTIONS):[];
  s.rewardedIds=isValidStrArr(raw.rewardedIds)?raw.rewardedIds.slice():[];
  if(raw.rewardStars&&typeof raw.rewardStars==='object'){Object.keys(raw.rewardStars).forEach(k=>{const v=+raw.rewardStars[k];if(Number.isFinite(v)&&v>=0)s.rewardStars[k]=v})}
  s.answeredQuizIds=isValidStrArr(raw.answeredQuizIds)?raw.answeredQuizIds.slice():[];
  s.answeredQuizzes=(raw.answeredQuizzes&&typeof raw.answeredQuizzes==='object')?{...raw.answeredQuizzes}:{};
  s.completedWorkbook=isValidStrArr(raw.completedWorkbook)?raw.completedWorkbook.slice():[];
  if(raw.retryQueues&&typeof raw.retryQueues==='object'){
    Object.keys(raw.retryQueues).forEach(k=>{if(Array.isArray(raw.retryQueues[k]))s.retryQueues[k]=raw.retryQueues[k].filter(x=>typeof x==='string')});
  }
  s.lastSectionId=Number.isInteger(raw.lastSectionId)&&raw.lastSectionId>=1&&raw.lastSectionId<=TOTAL_SECTIONS?raw.lastSectionId:1;
  s.lastStep=Number.isInteger(raw.lastStep)&&raw.lastStep>=1&&raw.lastStep<=3?raw.lastStep:1;
  return s;
}
function sanitizeState(raw){
  if(!raw||typeof raw!=='object')return emptyState();
  const s=emptyState();
  s.stars=Number.isFinite(+raw.stars)&&+raw.stars>=0?+raw.stars:0;
  s.masteredWords=isValidStrArr(raw.masteredWords)?raw.masteredWords.slice():[];
  s.needsReviewWords=isValidStrArr(raw.needsReviewWords)?raw.needsReviewWords.slice():[];
  s.achievements=isValidStrArr(raw.achievements)?raw.achievements.slice():[];
  s.currentLessonId=[1,2].includes(raw.currentLessonId)?raw.currentLessonId:1;
  s.lessons={1:sanitizeLessonState(raw.lessons&&raw.lessons[1]),2:sanitizeLessonState(raw.lessons&&raw.lessons[2])};
  if(!raw.lessons&&raw.completedSections){
    s.lessons[1]=sanitizeLessonState({completedSections:raw.completedSections,rewardedIds:raw.rewardedIds,answeredQuizIds:raw.answeredQuizIds,answeredQuizzes:raw.answeredQuizzes,retryQueues:raw.retryQueues,lastSectionId:raw.lastSectionId,lastStep:raw.lastStep,completedWorkbook:raw.completedWorkbook});
  }
  return s;
}
function loadState(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)appState=sanitizeState(JSON.parse(r))}catch(e){appState=emptyState()}updateStarUI(false);updateFlashcardTabState()}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(appState))}catch(e){}}
function rewardOnce(id,amt){
  const ls=lessonState();if(ls.rewardedIds.includes(id))return false;
  ls.rewardedIds.push(id);
  if(!ls.rewardStars||typeof ls.rewardStars!=='object')ls.rewardStars={};
  ls.rewardStars[id]=amt;
  appState.stars+=amt;saveState();updateStarUI(true);SoundFX.star();return true;
}
function starFallback(id){
  if(id.startsWith('cw_all_done_'))return 5;
  if(id.startsWith('rp_all_done_'))return 5;
  if(id.startsWith('wb_complete_'))return 5;
  if(id.startsWith('section_complete_'))return 10;
  if(id.startsWith('bq'))return 2;
  if(id.startsWith('bscr'))return 3;
  if(id.startsWith('wb_'))return 2;
  if(id.startsWith('mm_')||id.startsWith('flash_known_')||id.startsWith('cw_')||id.startsWith('writing_'))return 1;
  return 0;
}
function rewardStarAmount(ls,id){
  const v=ls.rewardStars&&ls.rewardStars[id];
  return Number.isFinite(v)?v:starFallback(id);
}
function lessonStarTotal(ls){
  return (ls.rewardedIds||[]).reduce((sum,id)=>sum+rewardStarAmount(ls,id),0);
}

function resetSectionProgress(sectionId){
  const ls=lessonState();
  const removedIds=[];
  const removeIf=(pred)=>{ls.rewardedIds=ls.rewardedIds.filter(id=>{if(pred(id)){removedIds.push(id);return false}return true})};
  const wordIds=getVocab(sectionId).map(w=>`mm_${w.id}`);
  removeIf(id=>wordIds.includes(id)||id.startsWith(`bq${appState.currentLessonId}_${sectionId}_`)||id.startsWith(`bscr${appState.currentLessonId}_${sectionId}_`)||(sectionId===5&&(id.startsWith(`cw_L${appState.currentLessonId}_`)||id===`cw_all_done_L${appState.currentLessonId}`))||(sectionId===7&&id===`rp_all_done_L${appState.currentLessonId}`)||id===`section_complete_${sectionId}`);
  const removedStars=removedIds.reduce((sum,id)=>sum+rewardStarAmount(ls,id),0);
  removedIds.forEach(id=>{if(ls.rewardStars)delete ls.rewardStars[id]});
  if(ls.retryQueues)delete ls.retryQueues[sectionId];
  ls.completedSections=ls.completedSections.filter(id=>id!==sectionId);
  appState.stars=Math.max(0,appState.stars-removedStars);
  sessionAnswers={};sessionScrambles={};practicePhase='main';
  currentStep=1;ls.lastStep=1;
  saveState();updateStarUI(false);updateFlashcardTabState();renderPath();updateFilterLabels();
  notice(`پیشرفت بخش ${toFa(sectionId)} صفر شد (−${toFa(removedStars)} ستاره)`);
}

/* ═══════════════════ CROSSWORD ═══════════════════ */
function cwAdvance(input){if(input.value.length>=1){let next=input.nextElementSibling;while(next&&next.tagName!=='INPUT')next=next.nextElementSibling;if(next)next.focus()}}
function cwBack(e,input){if(e.key==='Backspace'&&!input.value){let prev=input.previousElementSibling;while(prev&&prev.tagName!=='INPUT')prev=prev.previousElementSibling;if(prev)prev.focus()}}
function checkCrosswordWord(wordId){
  const container=document.querySelector(`[data-word-id="${wordId}"]`);if(!container)return;
  const inputs=container.querySelectorAll('.cw-box');
  let guess='';let allFilled=true;
  inputs.forEach(inp=>{guess+=inp.value.toLowerCase();if(!inp.value)allFilled=false});
  if(!allFilled){notice('همهٔ خانه‌ها را پر کن');return}
  let correctAnswer='';inputs.forEach(inp=>correctAnswer+=inp.dataset.answer.toLowerCase());
  if(guess===correctAnswer){inputs.forEach(inp=>{inp.classList.add('cw-box--correct');inp.disabled=true});SoundFX.correct();const g=rewardOnce(`cw_L${appState.currentLessonId}_${wordId}`,1);if(g)notice('آفرین! +۱ ⭐');checkAllCrosswordDone()}
  else{inputs.forEach(inp=>inp.classList.add('cw-box--wrong'));SoundFX.wrong();setTimeout(()=>inputs.forEach(inp=>inp.classList.remove('cw-box--wrong')),800)}
}
function checkAllCrosswordDone(){
  const all=document.querySelectorAll('.crossword-item');if(!all.length)return;
  const allDone=Array.from(all).every(item=>{const boxes=item.querySelectorAll('.cw-box');return boxes.length>0&&boxes[0].disabled===true});
  if(allDone){SoundFX.complete();if(rewardOnce(`cw_all_done_L${appState.currentLessonId}`,5)){notice('🎉 همهٔ جدول کامل شد! +۵ ⭐')}showAchievement(`crossword_king_L${appState.currentLessonId}`)}
}

/* ═══════════════════ ROLE PLAY ═══════════════════ */
function checkRolePlay(){
  const inputs=document.querySelectorAll('[data-rp-answer]');
  let allCorrect=true;let anyEmpty=false;
  inputs.forEach(inp=>{if(inp.disabled)return;const answer=inp.dataset.rpAnswer.toLowerCase();const user=inp.value.trim().toLowerCase();if(!user)anyEmpty=true;if(user===answer){inp.classList.add('role-input--correct');inp.classList.remove('role-input--wrong');inp.disabled=true}else{inp.classList.add('role-input--wrong');allCorrect=false}});
  if(anyEmpty&&!allCorrect){notice('همهٔ جای خالی‌ها را پر کن');return}
  if(allCorrect){SoundFX.complete();if(rewardOnce(`rp_all_done_L${appState.currentLessonId}`,5)){notice('🎉 همه پاسخ‌ها درست — +۵ ⭐')}showAchievement(`role_play_master_L${appState.currentLessonId}`)}
  else{SoundFX.wrong();notice('بعضی پاسخ‌ها نادرست است')}
}

function toggleAnswerTable(id){
  const el=document.getElementById(id);if(!el)return;
  el.hidden=!el.hidden;
  const block=el.closest('.reading-block');
  const btn=block&&block.querySelector('.answer-toggle');
  if(btn)btn.textContent=el.hidden?'👁️ نمایش پاسخ‌ها':'🙈 پنهان کردن پاسخ‌ها';
}
function renderWritingTask(lesson){
  const t=WRITING_TASKS[lesson];if(!t)return '';
  return `<div class="reading-block mt-16"><div class="reading-block-header"><span class="reading-block-title">${icon('keyboard',14)} نوشتن</span></div><div class="reading-block-body">
  <div class="note note--primary">${esc(t.hint)}</div>
  <div class="schedule-grid mt-16">${t.items.map((it,i)=>`<div class="schedule-day"><span class="schedule-day-val">${esc(it.q)}</span><input type="text" class="write-input" data-write-group="${t.id}" data-write-index="${i}" placeholder="…" aria-label="${esc(it.q)}" autocomplete="off" spellcheck="false"></div>`).join('')}</div>
  <div class="row mt-16" style="justify-content:flex-end;"><button type="button" class="btn btn--primary" onclick="checkWriting('${t.id}')">بررسی نوشته‌ها</button></div>
  <div class="feedback mt-16" id="${t.id}Fb" hidden role="status"></div>
  </div></div>`;
}
function checkWriting(id){
  const task=Object.values(WRITING_TASKS).find(t=>t.id===id);if(!task)return;
  const ins=[...document.querySelectorAll(`[data-write-group="${id}"]`)];
  let all=true,empty=false;
  ins.forEach((inp,i)=>{const v=inp.value.trim().toLowerCase().replace(/[.!?]/g,'');if(!v)empty=true;const ok=task.items[i]&&task.items[i].answers.some(a=>a===v);inp.classList.toggle('role-input--correct',ok);inp.classList.toggle('role-input--wrong',!ok);if(!ok)all=false});
  const fb=document.getElementById(id+'Fb');
  if(fb){fb.hidden=false;fb.className='feedback '+(all?'feedback--success':'feedback--error');fb.innerHTML=all?'عالی! همه درست بود.':'بعضی پاسخ‌ها نادرست است؛ دوباره تلاش کن.'}
  if(all){if(rewardOnce(`writing_${id}`,3))notice('آفرین! +۳ ⭐')}
  else if(empty)notice('همهٔ جاهای خالی را پر کن');
}

/* ═══════════════════ PRACTICE ═══════════════════ */
function buildPracticeQueue(sectionId){
  const q=[];
  const w=getVocab(sectionId).filter(x=>!x.noMatch);
  if(w.length>0)q.push({type:'match',id:`match_${sectionId}`,data:w});
  getQuizzes(sectionId).forEach(qz=>q.push({type:'quiz',id:qz.id,data:qz}));
  getScrambles(sectionId).forEach(sc=>q.push({type:'scramble',id:sc.id,data:sc}));
  return q;
}
function isPracticeItemSolved(item){
  if(!item)return false;
  const ls=lessonState();
  if(item.type==='match')return item.data.every(w=>ls.rewardedIds.includes(`mm_${w.id}`));
  if(item.type==='quiz')return isQuizAnswered(item.id);
  if(item.type==='scramble')return ls.rewardedIds.includes(item.id);
  return false;
}
function pruneSolvedRetries(){
  const q=getRetryQueue(currentSectionId);if(!q.length)return;
  const map={};practiceQueue.forEach(it=>{map[it.id]=it});
  let changed=false;
  for(let i=q.length-1;i>=0;i--){const it=map[q[i]];if(it&&isPracticeItemSolved(it)){q.splice(i,1);changed=true}}
  if(changed)saveState();
}
function renderPractice(host){
  practiceQueue=buildPracticeQueue(currentSectionId);
  pruneSolvedRetries();
  if(practiceAutoTimer){clearTimeout(practiceAutoTimer);practiceAutoTimer=null}
  if(!practiceQueue.length){host.innerHTML=`<div class="note note--danger">هیچ تمرینی برای این بخش تعریف نشده است.</div>`;return}
  const allSolved=practiceQueue.every(isPracticeItemSolved);
  if(allSolved&&!hasRetryItems()){
    if(!isSectionComplete(currentSectionId)){
      const m=getMissingTasks(currentSectionId);
      host.innerHTML=`<div class="summary"><div class="summary-icon">${icon('lock',32)}</div><div class="summary-title">تمرین‌های این بخش تمام شد</div><div class="summary-text">${esc(m||'برای بازشدن خلاصه، تمرین‌های مرحلهٔ یادگیری را کامل کن.')}</div><div class="summary-actions"><button type="button" class="btn btn--primary" onclick="goToStep(1)">رفتن به یادگیری ${icon('arrowLeft',16)}</button></div></div>`;
      return;
    }
    host.innerHTML=`<div class="summary"><div class="summary-icon">${icon('check',32)}</div><div class="summary-title">همهٔ تمارین حل شده 🎉</div><div class="summary-actions"><button type="button" class="btn btn--secondary" onclick="goToStep(1)">${icon('arrowRight',16)} مرور درس</button><button type="button" class="btn btn--primary" onclick="goToStep(3)">مشاهده خلاصه ${icon('arrowLeft',16)}</button></div></div>`;
    return;
  }
  if(hasMainItems()){practicePhase='main';practiceIndex=findNextMainIndex(0)}
  else{practicePhase='retry';practiceIndex=randomRetryIndex()}
  if(practiceIndex<0)practiceIndex=0;
  renderPracticeItem(host);
  updatePracticeProgress();updateComboUI();
}
function renderPracticeItem(host){
  const item=practiceQueue[practiceIndex];if(!item)return;
  if(practicePhase==='retry'){delete sessionAnswers[item.id];delete sessionScrambles[item.id]}
  const total=practiceQueue.length;const current=practiceIndex+1;
  const allComplete=isSectionComplete(currentSectionId);
  const solvedCount=practiceQueue.filter(isPracticeItemSolved).length;
  const pct=practicePhase==='main'?Math.round((solvedCount/total)*100):100;
  let contentHTML='';
  if(item.type==='match'){
    contentHTML=`<div><div class="row" style="justify-content:space-between;margin-bottom:var(--s-2);"><div style="font-size:var(--text-sm);font-weight:var(--w-medium);">${icon('grid',14)} جفت‌کردن</div><div class="badge" id="matchStatus" role="status">۰ از ${toFa(item.data.length)}</div></div><div class="match-hint" id="matchHint" role="status" hidden></div><div class="match-grid" id="matchGrid"></div></div>`;
  }else if(item.type==='quiz'){contentHTML=`<div id="quizHost"></div>`}
  else if(item.type==='scramble'){contentHTML=`<div id="scrambleHost"></div>`}
  let prevBtn;
  if(practicePhase==='retry'){prevBtn=`<button type="button" class="btn btn--text" onclick="goToStep(1)">${icon('arrowRight',16)} درس</button>`}
  else if(findPrevMainIndex(practiceIndex)<0){prevBtn=`<button type="button" class="btn btn--text" onclick="goToStep(1)">${icon('arrowRight',16)} یادگیری</button>`}
  else{prevBtn=`<button type="button" class="btn btn--text" onclick="prevPracticeItem()">${icon('arrowRight',16)} قبلی</button>`}
  let nextBtnHTML;
  if(practicePhase==='retry'){
    if(hasRetryItems())nextBtnHTML=`<button type="button" class="btn btn--secondary" onclick="nextPracticeItem()">بعدی ${icon('arrowLeft',16)}</button>`;
    else nextBtnHTML=`<button type="button" class="btn btn--primary" onclick="goToStep(3)">خلاصه ${icon('arrowLeft',16)}</button>`;
  }else if(allComplete&&!hasRetryItems()){
    nextBtnHTML=`<button type="button" class="btn btn--primary" onclick="goToStep(3)">خلاصه ${icon('arrowLeft',16)}</button>`;
  }else{
    nextBtnHTML=`<button type="button" class="btn btn--secondary" onclick="nextPracticeItem()">بعدی ${icon('arrowLeft',16)}</button>`;
  }
  const phaseBadge=practicePhase==='retry'?`<div id="retryBadgeWrap" style="display:flex;justify-content:center;margin-bottom:var(--s-3);"><span class="badge badge--danger" id="retryBadge">🔄 حلقه تکرار — ${toFa(getRetryQueue(currentSectionId).length)} سؤال</span></div>`:'';
  host.innerHTML=`<div class="combo-host" id="comboHost"></div><div class="practice-progress" id="practiceProgress"><div class="practice-progress-bar"><div class="practice-progress-fill" style="width:${pct}%"></div></div><div class="practice-progress-text">${practicePhase==='retry'?`<span>🔄 تکرار</span><span>${toFa(getRetryQueue(currentSectionId).length)} سؤال</span>`:`<span>تمرین ${toFa(current)} از ${toFa(total)}</span><span>${toFa(solvedCount)} حل شده</span>`}</div></div>${phaseBadge}<div class="practice-single">${contentHTML}</div><div class="practice-nav">${prevBtn}${nextBtnHTML}</div>`;
  if(item.type==='match')initMatch(item.data);
  else if(item.type==='quiz'){const quizList=getQuizzes(currentSectionId);const qIdx=quizList.findIndex(q=>q.id===item.id);renderQuizList([item.data],'quizHost',qIdx+1)}
  else if(item.type==='scramble')initBiteScrambleWidget([item.data]);
  updateComboUI();
  decorateA11y();
}
function nextPracticeItem(){
  if(practiceAutoTimer){clearTimeout(practiceAutoTimer);practiceAutoTimer=null}
  const item=practiceQueue[practiceIndex];
  if(item&&!isPracticeItemSolved(item)&&!isInRetry(item.id))addToRetry(item.id);
  if(practicePhase==='main'){
    const nextIdx=findNextMainIndex(practiceIndex+1);
    if(nextIdx>=0){practiceIndex=nextIdx;renderPracticeItem(document.getElementById('stepContent'));scrollToTopOfPractice();return}
    if(hasRetryItems()){practicePhase='retry';const rIdx=randomRetryIndex();if(rIdx>=0){practiceIndex=rIdx;renderPracticeItem(document.getElementById('stepContent'));scrollToTopOfPractice();return}}
    if(isSectionComplete(currentSectionId))goToStep(3);else renderPractice(document.getElementById('stepContent'));
  }else if(practicePhase==='retry'){
    if(hasRetryItems()){
      const retryIds=getRetryQueue(currentSectionId);let candidates=[];
      practiceQueue.forEach((it,i)=>{if(retryIds.includes(it.id)&&i!==practiceIndex)candidates.push(i)});
      if(!candidates.length)candidates=[practiceIndex];
      practiceIndex=candidates[Math.floor(Math.random()*candidates.length)];
      renderPracticeItem(document.getElementById('stepContent'));scrollToTopOfPractice();
    }else{if(isSectionComplete(currentSectionId))goToStep(3);else renderPractice(document.getElementById('stepContent'))}
  }
}
function prevPracticeItem(){
  if(practiceAutoTimer){clearTimeout(practiceAutoTimer);practiceAutoTimer=null}
  if(practicePhase==='retry'){goToStep(1);return}
  const prevIdx=findPrevMainIndex(practiceIndex);
  if(prevIdx>=0){practiceIndex=prevIdx;renderPracticeItem(document.getElementById('stepContent'));scrollToTopOfPractice()}
  else goToStep(1);
}
function scrollToTopOfPractice(){
  const el=document.getElementById('stepContent');if(!el){window.scrollTo({top:0,behavior:'smooth'});return}
  const headerOffset=80;const top=el.getBoundingClientRect().top+window.pageYOffset-headerOffset;
  window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
}

/* ═══════════════════ MATCH ═══════════════════ */
let matchState=null;
function initMatch(words){
  const ls=lessonState();
  matchState={tiles:[],first:null,locked:false,solved:0,total:words.length,celebrated:false};
  words.forEach(w=>{const d=ls.rewardedIds.includes(`mm_${w.id}`);matchState.tiles.push({id:`mm_en_${w.id}`,pairKey:w.id,text:w.en,speak:w.en,isEn:true,solved:d});matchState.tiles.push({id:`mm_fa_${w.id}`,pairKey:w.id,text:w.fa,speak:null,isEn:false,solved:d});if(d)matchState.solved++});
  matchState.celebrated=(matchState.solved===matchState.total&&matchState.total>0);
  matchState.tiles.sort(()=>Math.random()-.5);
  renderMatchGrid();
}
function renderMatchGrid(){
  const grid=document.getElementById('matchGrid'),status=document.getElementById('matchStatus');if(!grid||!matchState)return;
  grid.innerHTML=matchState.tiles.map(t=>{let cls='match-tile';if(t.solved)cls+=' match-tile--solved';else if(matchState.first&&matchState.first.id===t.id)cls+=' match-tile--selected';const lc=t.isEn?'en':'';const sa=t.speak?`data-speak="${esc(t.speak)}"`:'';return `<button type="button" class="${cls} ${lc}" ${sa} onclick="tapMatch('${t.id}')" ${t.solved?'disabled':''}>${esc(t.text)}</button>`}).join('');
  if(status){const d=matchState.solved===matchState.total&&matchState.total>0;status.className='badge'+(d?' match-status--done':'');status.innerText=d?`همه ${toFa(matchState.total)} جفت`:`${toFa(matchState.solved)} از ${toFa(matchState.total)}`}
}
function tapMatch(tileId){
  if(!matchState||matchState.locked)return;
  const tile=matchState.tiles.find(t=>t.id===tileId);if(!tile||tile.solved)return;
  SoundFX.click();
  if(matchState.first&&matchState.first.id===tile.id){matchState.first=null;renderMatchGrid();return}
  if(!matchState.first){matchState.first=tile;renderMatchGrid();return}
  const first=matchState.first;
  if(first.pairKey===tile.pairKey&&first.id!==tile.id){
    first.solved=true;tile.solved=true;matchState.first=null;matchState.solved++;
    SoundFX.correct();rewardOnce(`mm_${first.pairKey}`,1);
    renderMatchGrid();updatePracticeProgress();updateStepTabs();
    const hint=document.getElementById('matchHint');if(hint)hint.hidden=true;
    if(matchState.solved===matchState.total&&!matchState.celebrated){
      matchState.celebrated=true;
      const cur=practiceQueue[practiceIndex];
      if(cur&&cur.type==='match')removeFromRetry(cur.id);
      refreshRetryBadge();
      updatePracticeProgress();
      notice(`آفرین! همهٔ ${toFa(matchState.total)} جفت`);
    }
  }else{
    matchState.locked=true;SoundFX.wrong();
    const hint=document.getElementById('matchHint');
    if(hint){hint.hidden=false;hint.textContent='این جفت درست نبود؛ دوباره تلاش کن.'}
    const grid=document.getElementById('matchGrid');
    if(grid){grid.querySelectorAll('.match-tile').forEach(b=>{const oc=b.getAttribute('onclick')||'';if(oc.includes(first.id)||oc.includes(tile.id))b.classList.add('match-tile--wrong')})}
    setTimeout(()=>{matchState.first=null;matchState.locked=false;renderMatchGrid()},500);
  }
}

/* ═══════════════════ QUIZ ═══════════════════ */
function renderQuizList(list,hostId,startNum=1){
  const host=document.getElementById(hostId);if(!host)return;
  host.innerHTML=list.map((q,i)=>{
    const isSolved=isQuizAnswered(q.id);
    const sa=sessionAnswers[q.id];
    const isSessionWrong=sa&&!sa.isCorrect;
    const displayAnswered=isSolved||isSessionWrong||(sa&&sa.isCorrect);
    const qNum=startNum+i;
    const st=q.en.replace(/________/g,'blank').replace(/\n/g,' ');
    const opts=shuffled(q.opts.map((o,idx)=>({o,idx}))).map(({o,idx:oi},di)=>{let cls='quiz-option',d='',m='';if(displayAnswered){d='disabled';if(oi===q.ans){cls+=' quiz-option--correct';m=`<span class="quiz-opt-mark">${icon('check',16)}</span>`}else if(isSessionWrong&&oi===sa.chosen){cls+=' quiz-option--wrong';m=`<span class="quiz-opt-mark">${icon('x',16)}</span>`}}return `<button type="button" class="${cls}" data-opt="${oi}" onclick="answerQuiz('${q.id}',${oi},this)" ${d}><span class="quiz-opt-num">${toFa(di+1)}</span><span class="quiz-opt-text en">${esc(o)}</span>${m}</button>`}).join('');
    let fb;
    if(isSolved||(sa&&sa.isCorrect)){fb=`<div class="feedback feedback--success"><div class="feedback-lead">پاسخ صحیح</div>${q.exp}</div>`}
    else if(isSessionWrong){fb=`<div class="feedback feedback--error"><div class="feedback-lead">✗ پاسخ: <span class="en">${esc(q.opts[q.ans])}</span></div>${q.exp}</div>`}
    else{fb=`<div class="feedback" data-fb hidden role="status"></div>`}

/* ═══════════════════ SCRAMBLE ═══════════════════ */
let scrambleState=null;
function displayToken(text){if(text==='i')return 'I';if(text==='isnt')return "isn't";if(text==='arent')return "aren't";if(text==='tv')return 'TV';return text}
function getCorrectSentence(item){return item.words.map((w,i)=>{const d=displayToken(w);return i===0?d.charAt(0).toUpperCase()+d.slice(1):d}).join(' ')+item.punct}
function initBiteScrambleWidget(list){
  scrambleState={list,cards:list.map(item=>{const solved=lessonState().rewardedIds.includes(item.id);if(solved)return{solved:true,failed:false,bank:[],placed:item.words.map((w,i)=>({id:`tok_${item.id}_${i}`,text:w.toLowerCase()})),feedback:null};const tokens=item.words.map((w,i)=>({id:`tok_${item.id}_${i}`,text:w.toLowerCase()}));for(let i=tokens.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tokens[i],tokens[j]]=[tokens[j],tokens[i]]}if(tokens.map(t=>t.text).join(' ')===item.words.join(' '))tokens.reverse();return{solved:false,failed:false,bank:tokens,placed:[],feedback:null}})};
  renderScrambleStack();
}
function renderScrambleStack(){
  const host=document.getElementById('scrambleHost');if(!host||!scrambleState)return;

  host.innerHTML=`${total>1?`<div class="scramble-section-title">${icon('keyboard',16)} جمله‌سازی — ${toFa(total)} جمله</div>`:''}${allSolved&&total>1?`<div class="note note--success" style="margin-bottom:var(--s-4);">🎉 همه جمله‌ها کامل شد!</div>`:''}<div class="scramble-stack">${scrambleState.list.map((item,i)=>{const card=scrambleState.cards[i];const solved=card.solved;const failed=card.failed;const canCheck=!solved&&!failed&&card.placed.length===item.words.length;return `<div class="scramble-card ${solved?'scramble-card--solved':''} ${failed?'scramble-card--failed':''}"><div class="scramble-card-header"><span class="scramble-card-num">${solved?'✓':(failed?'✗':toFa(i+1))}</span><div class="scramble-card-fa">${esc(item.fa)}</div>${solved?'<span class="badge badge--success">حل شده</span>':''}${failed?'<span class="badge badge--danger">در حلقه تکرار</span>':''}</div><div class="scramble-card-body">${(solved||failed)?`<div class="scramble-answer ${solved?'scramble-answer--solved':'scramble-answer--failed'}"><span class="scramble-solved-text en">${esc(getCorrectSentence(item))}</span></div>`:`<div class="scramble-answer" id="scrambleAnswer_${i}"></div><div class="scramble-bank" id="scrambleBank_${i}"></div><div class="scramble-actions"><button type="button" class="btn btn--text btn--sm scramble-clear-btn" onclick="clearScramble(${i})" ${card.placed.length===0?'disabled':''}>${icon('refresh',12)} پاک کردن</button><button type="button" class="scramble-check-btn" onclick="checkScramble(${i})" ${canCheck?'':'disabled'}>${icon('check',22)} بررسی</button></div>`}<div class="feedback ${card.feedback?card.feedback.className:''}" id="scrambleFeedback_${i}" ${card.feedback?'':'hidden'}>${card.feedback?card.feedback.html:''}</div></div></div>`}).join('')}</div>`;
  scrambleState.cards.forEach((_,i)=>{if(!scrambleState.cards[i].solved&&!scrambleState.cards[i].failed)renderCardTokens(i)});
}
function renderCardTokens(idx){
  const card=scrambleState?.cards[idx];if(!card||card.solved||card.failed)return;
  const a=document.getElementById(`scrambleAnswer_${idx}`);const b=document.getElementById(`scrambleBank_${idx}`);if(!a||!b)return;

function placeScramble(idx,tokenId){const card=scrambleState?.cards[idx];if(!card||card.solved||card.failed)return;const i=card.bank.findIndex(t=>t.id===tokenId);if(i<0)return;SoundFX.click();card.placed.push(card.bank.splice(i,1)[0]);clearCardFeedback(idx);renderCardTokens(idx)}
function unplaceScramble(idx,tokenId){const card=scrambleState?.cards[idx];if(!card||card.solved||card.failed)return;const i=card.placed.findIndex(t=>t.id===tokenId);if(i<0)return;card.bank.push(card.placed.splice(i,1)[0]);clearCardFeedback(idx);renderCardTokens(idx)}
function clearScramble(idx){const card=scrambleState?.cards[idx];if(!card||card.solved||card.failed)return;card.bank=card.bank.concat(card.placed);card.placed=[];clearCardFeedback(idx);renderCardTokens(idx)}
function clearCardFeedback(idx){const card=scrambleState?.cards[idx];if(!card)return;card.feedback=null;const fb=document.getElementById(`scrambleFeedback_${idx}`);if(fb){fb.hidden=true;fb.innerHTML=''}}
function checkScramble(idx){
  const card=scrambleState?.cards[idx];if(!card||card.solved||card.failed)return;
  const item=scrambleState.list[idx];const u=card.placed.map(t=>t.text).join(' ');const t=item.words.join(' ');

  if(u===t){const fs=getCorrectSentence(item);speak(fs);SoundFX.correct();const g=rewardOnce(item.id,3);removeFromRetry(item.id);card.solved=true;card.feedback={className:'feedback feedback--success',html:(g?`<div class="feedback-lead">عالی! +۳ ⭐</div>`:`<div class="feedback-lead">آفرین!</div>`)+`<span class="en">${esc(fs)}</span>`};renderScrambleStack();updatePracticeProgress();updateStepTabs()}

}

const FILTER_MODES=['all','country','nationality','spelling','phrase','activity','time','day','mastered','needsReview'];

  const labels={all:`همه (${toFa(cnt.all)})`,country:`کشور (${toFa(cnt.country)})`,nationality:`ملیت (${toFa(cnt.nationality)})`,spelling:`املاء (${toFa(cnt.spelling)})`,phrase:`عبارت (${toFa(cnt.phrase)})`,activity:`فعالیت (${toFa(cnt.activity)})`,time:`زمان (${toFa(cnt.time)})`,day:`روز (${toFa(cnt.day)})`,mastered:`بلد (${toFa(cnt.mastered)})`,needsReview:`تمرین (${toFa(cnt.needsReview)})`};
  const b=document.getElementById('filterBar');if(!b)return;

function computeFiltered(mode){
  const all=getAllVocab();

  if(mode==='mastered')return all.filter(w=>appState.masteredWords.includes(w.id));

function filterVocab(mode){TTS.stop();currentFilter=mode;filteredList=computeFiltered(mode);flashIndex=0;flashFlipped=false;updateFilterLabels();renderFlashcardHost()}

const TTS=(function(){
let voices=[],sel=null,tier='NONE',q=[],spk=false,rate=1.0,reqId=0,wnS=false,wnV=false,wnF=false,onState=null,onVoice=null;
const RULES=[{re:/google us english( female)?/i,sc:100},{re:/microsoft (aria|jenny|guy|davis).*natural/i,sc:95},{re:/microsoft (zira|david|mark|aria)/i,sc:85},{re:/(samantha|ava|allison|susan|tom|karen|daniel)/i,sc:80},{re:/(enhanced|neural|premium|natural)/i,sc:70}];
const LOW=/compact|espeak|pico|robot/i;
function isSupported(){return 'speechSynthesis'in window&&'SpeechSynthesisUtterance'in window}
function getStoredRate(){try{const v=parseFloat(localStorage.getItem(TTS_RATE_KEY));if(Number.isFinite(v)&&v>=.5&&v<=1.1)return v}catch(e){}return 1.0}
function saveRate(r){try{localStorage.setItem(TTS_RATE_KEY,String(r))}catch(e){}}
function score(v){if(!v||!v.lang)return null;const l=v.lang.toLowerCase().replace('_','-');if(l==='en-us'){let s=50;for(const r of RULES){if(r.re.test(v.name||'')){s=r.sc;break}}if(LOW.test(v.name||''))s-=30;return{sc:s,tier:'US'}}if(/^en-(gb|au|ie|nz|ca|za|in|sg)$/.test(l)){let s=35;if(/google|natural|enhanced|neural/i.test(v.name||''))s+=10;if(LOW.test(v.name||''))s-=20;return{sc:s,tier:'OTHER_EN'}}if(/^en[-_]/.test(l))return{sc:20,tier:'OTHER_EN'};return{sc:5,tier:'FALLBACK'}}
function pick(){if(!voices.length)return null;const r=voices.map(v=>{const s=score(v);return s?{v,sc:s.sc,tier:s.tier}:null}).filter(Boolean).sort((a,b)=>b.sc-a.sc);return r.length?r[0]:null}
function refresh(){if(!isSupported())return;try{const l=window.speechSynthesis.getVoices();if(l&&l.length){const pn=sel?sel.name:null,pt=tier;voices=l;const p=pick();if(p){sel=p.v;tier=p.tier}const nn=sel?sel.name:null;if((pn!==nn||pt!==tier)&&onVoice){try{onVoice()}catch(e){}}}}catch(e){}}
function initV(){if(!isSupported())return;refresh();try{if(typeof window.speechSynthesis.onvoiceschanged!=='undefined')window.speechSynthesis.onvoiceschanged=refresh}catch(e){}let a=0;const i=setInterval(()=>{a++;refresh();if(sel||a>=30)clearInterval(i)},100)}
async function ensure(t=2500){if(sel)return true;if(!isSupported())return false;const st=Date.now();while(Date.now()-st<t){refresh();if(sel)return true;await new Promise(r=>setTimeout(r,120))}return!!sel}
function notify(){if(onState){try{onState(spk)}catch(e){}}}
function split(text){if(!text)return[];const M=180;const s=String(text).match(/[^.!?\n]+[.!?]+["')\]]?\s*|[^.!?\n]+$/g)||[text];const o=[];for(const x of s){const t=x.trim();if(!t)continue;if(t.length<=M)o.push(t);else{const p=t.split(/(?<=[,;:])\s+/);let b='';for(const pp of p){if((b+' '+pp).trim().length>M&&b){o.push(b.trim());b=pp}else b=(b+' '+pp).trim()}if(b)o.push(b)}}return o.length?o:[text]}
function speakOne(text,r){return new Promise(res=>{let done=false;const dn=rn=>{if(done)return;done=true;res(rn)};try{const u=new SpeechSynthesisUtterance(text);if(sel){u.voice=sel;u.lang=sel.lang||'en-US'}else u.lang='en-US';u.rate=Math.max(.5,Math.min(1.1,r));u.pitch=1;u.volume=1;u.onend=()=>dn('end');u.onerror=e=>dn('error:'+(e&&e.error?e.error:'unknown'));window.speechSynthesis.speak(u);const est=Math.max(2000,text.length*90/u.rate);setTimeout(()=>{if(!done)dn('timeout')},est+4000)}catch(e){dn('error:speak-failed')}})}
async function proc(){if(spk)return;if(!q.length)return;spk=true;notify();while(q.length){const it=q.shift();if(!it)continue;const cs=split(it.text);for(const c of cs){if(!spk)break;const r=await speakOne(c,it.rate);if(!spk)break;if(r==='error:not-allowed'||r==='error:interrupted')break}}spk=false;notify()}
async function speak(text,opt={}){if(!text)return;if(!isSupported()){if(!wnS){wnS=true;notice('مرورگر شما از تلفظ پشتیبانی نمی‌کند.')}return}const my=++reqId;stopIn();const ok=await ensure();if(my!==reqId)return;if(!ok){if(!wnV){wnV=true;notice('صدایی پیدا نشد.')}return}if(tier==='FALLBACK'&&!wnF){wnF=true;try{localStorage.setItem(TTS_FALLBACK_WARNED_KEY,'1')}catch(e){}notice('⚠️ صدای انگلیسی پیدا نشد.')}const r=opt.rate!==undefined?opt.rate:rate;q.push({text:String(text),rate:r});proc()}
function stopIn(){q=[];spk=false;if(isSupported()){try{window.speechSynthesis.cancel()}catch(e){}}notify()}
return{speak,stop:stopIn,setRate(r){rate=Math.max(.5,Math.min(1.1,r));saveRate(rate)},getRate(){return rate},isSupported,getVoiceName(){return sel?sel.name:null},getVoiceLang(){return sel?sel.lang:null},getVoiceLangCode(){if(!sel||!sel.lang)return'';const m=sel.lang.match(/^en[-_]([a-z]{2})$/i);return m?m[1].toUpperCase():''},getVoiceTier(){return tier},isSpeaking(){return spk},onStateChange(fn){onState=fn},onVoiceChange(fn){onVoice=fn},_init(){rate=getStoredRate();try{wnF=localStorage.getItem(TTS_FALLBACK_WARNED_KEY)==='1'}catch(e){}if(isSupported())initV()}}
})();
TTS._init();
TTS.onStateChange(spk=>{const c=document.getElementById('stopChip');if(c)c.hidden=!spk});

function updateVoiceUI(){const b=document.getElementById('voiceBadge');if(!b)return;const t=TTS.getVoiceTier();if(t==='US'||t==='NONE'){b.hidden=true;return}b.hidden=false;if(t==='OTHER_EN'){b.textContent=TTS.getVoiceLangCode()||'EN';b.className='voice-badge voice-badge--warn'}else if(t==='FALLBACK'){b.textContent='!';b.className='voice-badge voice-badge--error'}}
function openVoiceModal(){const t=document.getElementById('voiceModalText');if(t)t.innerHTML=getVoiceInfoHTML();document.getElementById('voiceModal').hidden=false}
function closeVoiceModal(){document.getElementById('voiceModal').hidden=true}
function testVoice(){if(isMuted){notice('صدا قطع است');return}TTS.speak('This is a test. Hello, how are you?')}
function getVoiceInfoHTML(){const t=TTS.getVoiceTier(),n=TTS.getVoiceName()||'نامشخص',l=TTS.getVoiceLang()||'—';if(t==='US')return`<div style="display:flex;align-items:center;gap:var(--s-2);margin-bottom:var(--s-3);"><span style="color:var(--success);font-size:20px;">✓</span><strong style="color:var(--success-dark);">صدای انگلیسی آمریکایی</strong></div><div style="background:var(--success-bg);padding:var(--s-3);border-radius:var(--r-sm);"><div style="font-weight:var(--w-semibold);"><span class="en">${esc(n)}</span></div></div>`;if(t==='OTHER_EN')return`<div style="display:flex;align-items:center;gap:var(--s-2);margin-bottom:var(--s-3);"><span style="color:var(--amber);font-size:20px;">⚠</span><strong style="color:var(--amber-dark);">صدای آمریکایی در دسترس نیست</strong></div><div style="background:var(--amber-bg);padding:var(--s-3);border-radius:var(--r-sm);"><div style="font-weight:var(--w-semibold);"><span class="en">${esc(n)}</span></div><div style="font-size:11px;"><span class="en">${esc(l)}</span></div></div>`;return`<p style="font-size:var(--text-sm);color:var(--danger-dark);">صدای انگلیسی پیدا نشد.</p>`}

/* ═══════════════════ INIT ═══════════════════ */
document.addEventListener('DOMContentLoaded',()=>{
  loadState();
  updateStreak();updateMuteUI();updateSpeedUI();
  TTS.onVoiceChange(()=>{updateVoiceUI();if(currentPathView==='section'){const p=document.getElementById('pathContent');if(p&&p.querySelector('.card'))renderSectionView()}});
  updateVoiceUI();
  const meta=LESSON_META[appState.currentLessonId];
  document.getElementById('brandBadge').textContent=meta.badge;
  document.getElementById('brandTitle').textContent=meta.title;
  currentPathView='overview';currentSectionId=lessonState().lastSectionId||1;currentStep=1;
  renderPath();updateFilterLabels();renderLessonSwitch();
  const repaintLessonRings=()=>{if(currentMode==='path'&&currentPathView==='overview')paintLessonRings()};
  window.addEventListener('resize',()=>{clearTimeout(lessonRingTimer);lessonRingTimer=setTimeout(repaintLessonRings,120)});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(repaintLessonRings).catch(()=>{});
});
</script>
</body>
